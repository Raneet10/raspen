[workspace]
members = [
    "crates/types",
    "crates/consensus",
    "crates/sequencer",
    "crates/storage",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
bincode     = "2"
anyhow      = "1"
thiserror   = "1"
tracing     = "0.1"
tokio       = { version = "1", features = ["full"] }
rocksdb     = { version = "0.22", default-features = false }
sha2        = "0.10"
tempfile    = "3"

[workspace.lints.rust]
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
